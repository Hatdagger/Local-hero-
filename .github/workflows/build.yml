name: Build APK

on:
  push:
    paths-ignore: ['desktop/**', '.github/workflows/desktop.yml']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Run tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Build APK
        run: gradle assembleRelease --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Local-Hero.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Local-Hero-apk
          path: Local-Hero.apk
